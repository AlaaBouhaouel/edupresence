{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié – EduPresence</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-logo">
            <img src="{% static 'img/logo/dark-bg.png' %}" alt="EduPresence">
        </div>

        <h2 style="margin-bottom:6px;">Mot de passe oublié</h2>
        <p class="text-muted" style="font-size:.875rem;margin-bottom:22px;">
            Entrez votre adresse e-mail et nous vous enverrons les instructions de réinitialisation.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input class="form-control" type="email" id="email" name="email"
                       placeholder="exemple@email.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
                <i class="fas fa-paper-plane"></i> Envoyer les instructions
            </button>
        </form>

        <div class="auth-footer">
            <a href="/signin/"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
        </div>

    </div>
</div>
</body>
</html>
